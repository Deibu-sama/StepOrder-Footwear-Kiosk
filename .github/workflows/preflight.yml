name: StepOrder Preflight

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, ctype, dom, fileinfo, filter, gd, iconv, libxml, mbstring, simplexml, xml, xmlreader, xmlwriter, zip, zlib, openssl
          tools: composer:v2
          coverage: none

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: PHP syntax check
        shell: bash
        run: |
          set -e
          find app bootstrap config routes -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Compile every Blade view
        run: php artisan view:cache

      - name: Verify routes
        run: php artisan route:list --no-ansi
